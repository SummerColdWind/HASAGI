[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "hasagi"
version = "0.1.0b1"
description = "CPU inference for corneal IVCM tissue layers and nerve discernibility"
readme = "README.md"
license = "LicenseRef-HASAGI-Noncommercial AND Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
requires-python = ">=3.10"
dependencies = ["numpy", "onnxruntime", "Pillow>=9.1"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["hasagi"]
include-package-data = false

[tool.setuptools.package-data]
hasagi = ["models/*.onnx"]

[tool.pytest.ini_options]
pythonpath = ["src"]
